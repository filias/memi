[project]
name = "memi"
version = "0.1.0"
description = "A memory card game"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=25.1.0",
    "memi-engine>=0.2.0",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["memi"]

[tool.ruff.lint.isort]
# Keep aliased imports grouped in one statement per module, rather than
# exploding each `X as Y` into its own from-import.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Legacy, kept for reference and imported by nothing: app_old.py predates the
# move to memi-engine, and memi/logic/ is only reachable from it. Both are
# candidates for deletion — until then, don't lint code we no longer run.
"memi/app_old.py" = ["BLE001", "S110"]
"memi/logic/*.py" = ["BLE001", "S110"]
