[project]
name = "memi"
version = "0.1.0"
description = "A memory card game"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=25.1.0",
    "memi-engine @ git+https://github.com/filias/memi-engine.git",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["memi"]
