<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Reports - Memi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .reports { max-width: 600px; width: 90vw; padding: 1rem 0; }
        .report {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1rem; margin-bottom: 0.5rem;
            background: #fff; border-radius: 0.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .report.excluded { opacity: 0.4; }
        .report-preview {
            width: 80px; height: 80px; border-radius: 0.4rem;
            object-fit: contain; background: #f0f0f0; flex-shrink: 0;
        }
        .report-info { flex: 1; min-width: 0; }
        .report-item { font-weight: bold; color: #2c2c2c; }
        .report-cats { font-size: 0.75rem; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .report-time { font-size: 0.7rem; color: #bbb; }
        .report-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        .report-actions button {
            padding: 0.3rem 0.7rem; border: 1px solid #ccc; border-radius: 1rem;
            background: transparent; cursor: pointer; font-size: 0.75rem;
            transition: all 0.2s;
        }
        .btn-exclude { color: #c44; }
        .btn-exclude:hover { background: #c44; color: #fff; border-color: #c44; }
        .btn-restore { color: #2a7a4a; }
        .btn-restore:hover { background: #2a7a4a; color: #fff; border-color: #2a7a4a; }
        .empty { color: #999; text-align: center; padding: 3rem 0; }
    </style>
</head>
<body>
    <h1><a href="/" style="color:inherit; text-decoration:none;">memi</a></h1>
    <p class="subtitle">reported items</p>

    <div class="reports">
        {% if not reports %}
        <p class="empty">No reports yet.</p>
        {% endif %}
        {% for r in reports %}
        <div class="report {{ r.status }}" id="report-{{ loop.index }}">
            <img class="report-preview" id="img-{{ loop.index }}" src="" alt=""
                 data-item="{{ r.item }}" data-cats="{{ r.cats }}">
            <div class="report-info">
                <div class="report-item">{{ r.item }}</div>
                <div class="report-cats">{{ r.cats }}</div>
                <div class="report-time">{{ r.time }}</div>
            </div>
            <div class="report-actions">
                {% if r.status == 'excluded' %}
                <button class="btn-restore" onclick="restore('{{ r.item }}')">restore</button>
                {% else %}
                <button class="btn-exclude" onclick="exclude('{{ r.item }}')">exclude</button>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

    <p style="padding:2rem 0;"><a href="/" style="color:#999; font-size:0.9rem;">&larr; back to playing</a></p>

    <script>
        // Load preview images
        document.querySelectorAll('.report-preview').forEach(async img => {
            const item = img.dataset.item;
            const cats = img.dataset.cats;
            try {
                const r = await fetch(`/api/review/preview?item=${encodeURIComponent(item)}&cats=${encodeURIComponent(cats)}`);
                const data = await r.json();
                if (data.image) img.src = data.image;
            } catch (e) {}
        });

        async function exclude(item) {
            await fetch('/api/review/exclude', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({item}),
            });
            location.reload();
        }
        async function restore(item) {
            await fetch('/api/review/restore', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({item}),
            });
            location.reload();
        }
    </script>
</body>
</html>
