<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a href="/about" class="about-link">about</a>
    <h1>memi</h1>
    <p class="subtitle">practise your memory</p>

    <div class="categories" id="main-categories">
        {% for item in top_level %}
        {% if item.has_submenu %}
        <button onclick="toggleSubmenu('{{ item.label }}')">{{ item.label }}</button>
        {% else %}
        <button onclick="selectCategory('{{ item.key }}'); this.classList.add('active')">{{ item.label }}</button>
        {% endif %}
        {% endfor %}
    </div>

    <div class="categories submenu" id="submenu" style="display:none">
        <button class="back-btn" onclick="closeSubmenu()">&larr;</button>
        <div id="submenu-buttons" style="display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center;"></div>
    </div>

    <div class="continent-filter" id="continent-filter">
        <button onclick="toggleContinent('africa', this)">africa</button>
        <button onclick="toggleContinent('america', this)">america</button>
        <button onclick="toggleContinent('asia', this)">asia</button>
        <button onclick="toggleContinent('europe', this)">europe</button>
        <button onclick="toggleContinent('oceania', this)">oceania</button>
    </div>
    <div class="continent-filter" id="animal-class-filter">
        <button onclick="toggleAnimalClass('mammals', this)">mammals</button>
        <button onclick="toggleAnimalClass('birds', this)">birds</button>
        <button onclick="toggleAnimalClass('reptiles', this)">reptiles</button>
        <button onclick="toggleAnimalClass('amphibians', this)">amphibians</button>
        <button onclick="toggleAnimalClass('marine', this)">marine</button>
        <button onclick="toggleAnimalClass('insects', this)">insects</button>
        <button onclick="toggleAnimalClass('dogs', this)">dogs</button>
        <button onclick="toggleAnimalClass('cats', this)">cats</button>
    </div>
    <div class="continent-filter" id="people-role-filter">
        <button onclick="togglePeopleRole('scientists', this)">scientists</button>
        <button onclick="togglePeopleRole('explorers', this)">explorers</button>
        <button onclick="togglePeopleRole('artists', this)">artists</button>
        <button onclick="togglePeopleRole('musicians', this)">musicians</button>
        <button onclick="togglePeopleRole('writers', this)">writers</button>
        <button onclick="togglePeopleRole('leaders', this)">leaders</button>
        <button onclick="togglePeopleRole('actors', this)">actors</button>
        <button onclick="togglePeopleRole('athletes', this)">athletes</button>
    </div>
    <div class="card" id="card" onclick="handleClick()">
        <span class="loading" id="status">pick a category</span>
        <img id="image" style="display:none" alt="">
        <div class="clue" id="clue"></div>
        <div class="answer" id="answer"></div>
        <div class="tag" id="tag"></div>
        <img class="reveal-image" id="reveal-image" alt="">
    </div>
    <div class="mode-toggle">
        <button id="clue-toggle" onclick="toggleClueMode()">clues: off</button>
    </div>
    <div id="clue-area" style="display:none; text-align:center;">
        <button id="clue-btn" onclick="revealLetter()">show letter</button>
        <p id="clue-letters" class="clue-letters"></p>
    </div>
    <div style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1rem;">
        <p class="hint" id="hint" style="margin:0;"></p>
        <button id="report-btn" onclick="reportItem()" style="display:none; padding:0.3rem 0.7rem; border:1px solid #444; border-radius:1rem; background:transparent; color:#666; font-size:0.75rem; cursor:pointer;">report</button>
    </div>

    <script id="subcategories-data" type="application/json">{{ subcategories | tojson }}</script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <footer id="tmdb-footer" style="display:none; margin-top:3rem; padding:1rem; text-align:center; opacity:0.4;">
        <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">
            <img src="{{ url_for('static', filename='tmdb-logo.svg') }}" alt="TMDB" style="height:1rem;">
        </a>
    </footer>
    <footer id="eskeletons-footer" style="display:none; margin-top:3rem; padding:1rem; text-align:center; opacity:0.5; font-size:0.75rem; color:#888;">
        Bone images courtesy of <a href="https://www.eskeletons.org/" target="_blank" rel="noopener" style="color:#90cea1;">eSkeletons.org</a>,
        John Kappelman &amp; UT Austin
        (<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener" style="color:#90cea1;">CC BY-NC-SA 4.0</a>)
    </footer>
    <script data-goatcounter="https://filias.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
